# LibreLane config for ALU_TOP on the fab PDKs. Run with:
#   scripts/run_librelane.sh examples/PPA-opt-32b-alu-bekiryy/librelane/config.yaml --pdk <pdk>
DESIGN_NAME: ALU_TOP
VERILOG_FILES: dir::../rtl/*.sv
CLOCK_PORT: clk
CLOCK_PERIOD: 10
PNR_SDC_FILE: dir::../constraints/alu.sdc
SIGNOFF_SDC_FILE: dir::../constraints/alu.sdc

# Every PDK is run at its edge: the shortest clock that closes typical-corner
# setup, at >= 50% core utilization.
FP_CORE_UTIL: 55
PL_TARGET_DENSITY_PCT: 65

pdk::sky130*:
  STD_CELL_LIBRARY: sky130_fd_sc_hd
  CLOCK_PERIOD: 8.9
pdk::gf180mcu*:
  STD_CELL_LIBRARY: gf180mcu_fd_sc_mcu7t5v0
  CLOCK_PERIOD: 18.5
pdk::ihp-sg13g2:
  STD_CELL_LIBRARY: sg13g2_stdcell
  CLOCK_PERIOD: 7.3
pdk::icsprout55:
  STD_CELL_LIBRARY: ics55_LLSC_H7CR
  CLOCK_PERIOD: 3.2
