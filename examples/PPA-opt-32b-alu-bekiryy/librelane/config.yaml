# LibreLane config for ALU_TOP on the fab PDKs. Run with:
#   scripts/run_librelane.sh examples/PPA-opt-32b-alu-bekiryy/librelane/config.yaml --pdk <pdk>
DESIGN_NAME: ALU_TOP
VERILOG_FILES: dir::../rtl/*.sv
CLOCK_PORT: clk
CLOCK_PERIOD: 10
PNR_SDC_FILE: dir::../constraints/alu.sdc
SIGNOFF_SDC_FILE: dir::../constraints/alu.sdc

# Every PDK is run at its edge: the shortest clock that closes typical-corner
# setup, at >= 50% core utilization. Each PDK uses its default library unless
# run.sh is given another (sky130A/hs); the scl:: blocks set those clocks.
FP_CORE_UTIL: 55
PL_TARGET_DENSITY_PCT: 65

pdk::sky130*:
  # sky130_fd_sc_hd, the PDK's default library; others with run.sh sky130A/<lib>
  CLOCK_PERIOD: 8.8
scl::sky130_fd_sc_hs:
  CLOCK_PERIOD: 6.25
scl::sky130_fd_sc_ms:
  CLOCK_PERIOD: 7.3
scl::sky130_fd_sc_ls:
  CLOCK_PERIOD: 9.2
scl::sky130_fd_sc_hdll:
  CLOCK_PERIOD: 10.4
pdk::gf180mcu*:
  CLOCK_PERIOD: 18.5
pdk::ihp-sg13g2:
  CLOCK_PERIOD: 6.6
pdk::icsprout55:
  CLOCK_PERIOD: 3.15
  # Room for the router: the cells' 0.09 um pins leave little space for vias
  FP_CORE_UTIL: 47
  PL_TARGET_DENSITY_PCT: 55
